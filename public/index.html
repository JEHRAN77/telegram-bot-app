<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📹 ভিডিও টপিক</title>
    <script src="//libtl.com/sdk.js" data-zone="11737734" data-sdk="show_11737734"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#fff;min-height:100vh}
        #app{max-width:600px;margin:0 auto;padding:16px;padding-bottom:80px}
        header{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #272727;margin-bottom:16px}
        header h1{font-size:20px;font-weight:700}
        #user-info{font-size:14px;color:#aaa}
        #loading{text-align:center;padding:40px;color:#888;font-size:16px}
        #topic-grid{display:grid;grid-template-columns:1fr;gap:16px}
        .topic-card{background:#1a1a1a;border-radius:12px;overflow:hidden;border:1px solid #272727;display:flex;flex-direction:column;transition:all .3s ease}
        .topic-card.unlocked-card{border-color:#22c55e;box-shadow:0 0 20px rgba(34,197,94,0.2)}
        .topic-card:active{transform:scale(.98)}
        .thumbnail-container{position:relative;background:#2a2a2a;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}
        .thumbnail-container img{width:100%;height:100%;object-fit:cover}
        .lock-icon{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.75);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;transition:all .5s ease}
        .lock-icon.unlocked{background:rgba(34,197,94,.9);box-shadow:0 0 20px rgba(34,197,94,.5)}
        .video-count-badge{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,.75);border-radius:4px;padding:4px 10px;font-size:12px;color:#fff}
        .topic-info{padding:14px 16px 10px 16px;flex:1}
        .topic-title{font-size:18px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .topic-meta{font-size:14px;color:#888;margin-top:4px}
        .topic-actions{padding:0 16px 16px 16px}
        .btn-ad{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:600;color:#fff;cursor:pointer;transition:all .5s ease}
        .btn-ad:active{transform:scale(.97)}
        .btn-ad:disabled{opacity:.8;cursor:not-allowed}
        .btn-ad.watch{background:#dc2626;box-shadow:0 4px 15px rgba(220,38,38,.3)}
        .btn-ad.watch:active{background:#b91c1c}
        .btn-ad.unlocked{background:#22c55e;box-shadow:0 4px 25px rgba(34,197,94,.5);animation:pulse-green 2s infinite}
        @keyframes pulse-green{0%{box-shadow:0 4px 25px rgba(34,197,94,.5)}50%{box-shadow:0 4px 40px rgba(34,197,94,.8)}100%{box-shadow:0 4px 25px rgba(34,197,94,.5)}}
        .btn-ad.watching{background:#f59e0b;box-shadow:0 4px 15px rgba(245,158,11,.3)}
        .ad-progress{font-size:13px;color:#fbbf24;text-align:center;margin-top:8px}
        .timeout-badge{font-size:11px;color:#f87171;margin-top:4px}
        .timeout-badge.unlocked-badge{color:#4ade80}
        #ad-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:rgba(0,0,0,.85);justify-content:center;align-items:center;flex-direction:column}
        #ad-overlay.show{display:flex}
        #ad-overlay .ad-content{text-align:center;padding:30px}
        #ad-overlay .ad-timer{color:#fff;font-size:72px;font-weight:700;margin:20px 0}
        #ad-overlay .ad-timer span{color:#fbbf24}
        #ad-overlay .ad-label{color:#aaa;font-size:18px}
        #ad-overlay .ad-skip-btn{background:#22c55e;color:#fff;border:none;border-radius:10px;padding:14px 40px;font-size:18px;font-weight:600;cursor:pointer;display:none;margin-top:20px;box-shadow:0 4px 25px rgba(34,197,94,.4)}
        #ad-overlay .ad-skip-btn.show{display:inline-block}
        @media(max-width:480px){#topic-grid{gap:14px}.topic-title{font-size:16px!important}header h1{font-size:17px}.btn-ad{font-size:14px;padding:12px}#ad-overlay .ad-timer{font-size:48px}}
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>📹 ভিডিও টপিক</h1>
            <div id="user-info"><span id="user-name"></span></div>
        </header>
        <div id="loading">⏳ লোড হচ্ছে...</div>
        <div id="topic-grid"></div>
    </div>

    <div id="ad-overlay">
        <div class="ad-content">
            <div class="ad-label">⏳ অ্যাড দেখুন</div>
            <div class="ad-timer"><span id="adTimer">0</span> সেকেন্ড</div>
            <button class="ad-skip-btn" id="adSkipBtn">✅ অ্যাড শেষ! আনলক করুন</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        (function() {
            'use strict';
            console.log('App started - OMG Rewarded Popup');
            
            var Telegram = null;
            try {
                Telegram = window.Telegram.WebApp;
                if (Telegram) Telegram.ready();
            } catch(e) {}

            var API_BASE = '/api';
            var topics = [];
            var unlockedTopics = {};
            var isWatching = false;
            var currentTopic = null;
            var currentBtn = null;
            var timerInterval = null;
            var totalAdsRequired = 0;
            var adCount = 0;

            function getUserId() {
                try {
                    if (Telegram && Telegram.initDataUnsafe && Telegram.initDataUnsafe.user) {
                        return Telegram.initDataUnsafe.user.id;
                    }
                    return null;
                } catch(e) { return null; }
            }

            function getUserName() {
                try {
                    if (Telegram && Telegram.initDataUnsafe && Telegram.initDataUnsafe.user) {
                        return Telegram.initDataUnsafe.user.first_name || 'ইউজার';
                    }
                    return 'ইউজার';
                } catch(e) { return 'ইউজার'; }
            }

            function getThumbnailUrl(topic) {
                if (topic.thumbnail) return API_BASE + '/thumbnail/' + topic.thumbnail;
                if (topic.thumbnails && topic.thumbnails.length > 0) return API_BASE + '/thumbnail/' + topic.thumbnails[0];
                return null;
            }

            function isTopicUnlocked(topicId) {
                return unlockedTopics[topicId] === true;
            }

            function renderTopics() {
                var grid = document.getElementById('topic-grid');
                var loading = document.getElementById('loading');
                if (!topics || topics.length === 0) {
                    loading.textContent = '📭 এখনো কোনো টপিক যোগ করা হয়নি';
                    return;
                }
                loading.style.display = 'none';
                grid.innerHTML = '';

                topics.forEach(function(topic) {
                    var card = document.createElement('div');
                    card.className = 'topic-card';
                    var videoCount = topic.videoCount || (topic.videos ? topic.videos.length : 0);
                    var thumbUrl = getThumbnailUrl(topic);
                    var adsRequired = topic.adsRequired || 0;
                    var topicUnlocked = isTopicUnlocked(topic.id);

                    if (topicUnlocked) card.classList.add('unlocked-card');

                    var thumbnailHtml = '';
                    if (thumbUrl) {
                        thumbnailHtml = '<img src="' + thumbUrl + '" alt="' + (topic.title || 'টপিক') + '" onerror="this.parentElement.innerHTML=\'<span style=\'font-size:60px;color:#555;\'>📹</span>\'">';
                    }

                    var btnHtml = '';
                    if (topicUnlocked) {
                        btnHtml = '<button class="btn-ad unlocked" disabled>✅ আনলক করা আছে</button>';
                    } else {
                        btnHtml = '<button class="btn-ad watch" data-topic-id="' + topic.id + '" data-ads="' + adsRequired + '">🎬 ' + adsRequired + 'টি অ্যাড দেখে আনলক করুন</button>';
                    }

                    card.innerHTML = `
                        <div class="thumbnail-container">
                            ${thumbnailHtml || '<span style="font-size:60px;color:#555;">📹</span>'}
                            <div class="lock-icon ${topicUnlocked ? 'unlocked' : ''}">${topicUnlocked ? '🔓' : '🔒'}</div>
                            <div class="video-count-badge">📹 ${videoCount}টি ভিডিও</div>
                        </div>
                        <div class="topic-info">
                            <div class="topic-title">${topic.title || 'নামবিহীন টপিক'}</div>
                            <div class="topic-meta">📹 ${videoCount}টি ভিডিও • 🔢 ${adsRequired}টি অ্যাড দেখে আনলক করুন</div>
                            ${topicUnlocked ? '<div class="timeout-badge unlocked-badge">✅ ৩০ মিনিটের জন্য আনলক করা আছে</div>' : '<div class="timeout-badge">⏳ ৩০ মিনিট পর আবার লক হবে</div>'}
                        </div>
                        <div class="topic-actions">
                            ${btnHtml}
                            <div class="ad-progress" id="progress-${topic.id}"></div>
                        </div>
                    `;

                    grid.appendChild(card);

                    var btn = card.querySelector('.btn-ad.watch');
                    if (btn) {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            var topicId = this.getAttribute('data-topic-id');
                            var topicObj = topics.find(function(t) { return t.id === topicId; });
                            if (topicObj) {
                                startAdWatch(topicObj, this);
                            }
                        });
                    }
                });
            }

            function unlockTopic(topic, btnElement) {
                unlockedTopics[topic.id] = true;
                btnElement.textContent = '✅ আনলক করা আছে';
                btnElement.className = 'btn-ad unlocked';
                btnElement.disabled = true;

                var card = btnElement.closest('.topic-card');
                if (card) card.classList.add('unlocked-card');

                var progressEl = document.getElementById('progress-' + topic.id);
                if (progressEl) {
                    progressEl.textContent = '🎉 টপিকটি আনলক হয়েছে! (৩০ মিনিটের জন্য)';
                    progressEl.className = 'ad-progress';
                }

                isWatching = false;
                adCount = 0;

                var lockIcon = card.querySelector('.lock-icon');
                if (lockIcon) {
                    lockIcon.textContent = '🔓';
                    lockIcon.className = 'lock-icon unlocked';
                }

                var timeoutBadge = card.querySelector('.timeout-badge');
                if (timeoutBadge) {
                    timeoutBadge.textContent = '✅ ৩০ মিনিটের জন্য আনলক করা আছে';
                    timeoutBadge.className = 'timeout-badge unlocked-badge';
                }

                var userId = getUserId();
                if (userId) {
                    fetch(API_BASE + '/unlock-topic', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: userId, topicId: topic.id })
                    }).catch(function(err) { console.error('Unlock error:', err); });
                }
            }

            function startAdWatch(topic, btnElement) {
                if (isWatching) return;
                totalAdsRequired = parseInt(btnElement.getAttribute('data-ads')) || 1;
                adCount = 0;
                currentTopic = topic;
                currentBtn = btnElement;
                isWatching = true;

                btnElement.disabled = true;
                btnElement.className = 'btn-ad watching';
                btnElement.textContent = '⏳ অ্যাড দেখছেন... (0/' + totalAdsRequired + ')';

                var progressEl = document.getElementById('progress-' + topic.id);
                if (progressEl) {
                    progressEl.textContent = 'প্রগ্রেস: 0/' + totalAdsRequired;
                    progressEl.className = 'ad-progress';
                }
                showOMGAd();
            }

            function showOMGAd() {
                var overlay = document.getElementById('ad-overlay');
                var skipBtn = document.getElementById('adSkipBtn');
                var timerDisplay = document.getElementById('adTimer');

                overlay.classList.add('show');
                skipBtn.className = 'ad-skip-btn';
                skipBtn.disabled = true;
                timerDisplay.textContent = '15';

                try {
                    // OMG Rewarded Popup
                    show_11737734('pop').then(function() {
                        // অ্যাড সম্পূর্ণ হয়েছে - রিওয়ার্ড দিন
                        console.log('Ad completed - Reward user');
                        completeAd();
                    }).catch(function(e) {
                        console.error('Ad error:', e);
                        resetAdButton();
                        overlay.classList.remove('show');
                    });
                } catch(error) {
                    console.error('OMG ad error:', error);
                    resetAdButton();
                    overlay.classList.remove('show');
                }

                // টাইমার (সুরক্ষার জন্য)
                var timeLeft = 15;
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(function() {
                    timeLeft--;
                    timerDisplay.textContent = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                    }
                }, 1000);
            }

            function completeAd() {
                var overlay = document.getElementById('ad-overlay');
                var skipBtn = document.getElementById('adSkipBtn');
                var timerDisplay = document.getElementById('adTimer');

                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

                skipBtn.className = 'ad-skip-btn show';
                skipBtn.disabled = false;
                timerDisplay.textContent = '✅';
                skipBtn.onclick = function() { onAdComplete(); };
            }

            function resetAdButton() {
                if (currentBtn) {
                    currentBtn.disabled = false;
                    currentBtn.className = 'btn-ad watch';
                    currentBtn.textContent = '🎬 ' + totalAdsRequired + 'টি অ্যাড দেখে আনলক করুন';
                }
                isWatching = false;
            }

            function onAdComplete() {
                var overlay = document.getElementById('ad-overlay');
                overlay.classList.remove('show');
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

                adCount++;
                if (currentBtn) {
                    currentBtn.textContent = '⏳ অ্যাড দেখছেন... (' + adCount + '/' + totalAdsRequired + ')';
                    var progressEl = document.getElementById('progress-' + (currentTopic ? currentTopic.id : ''));
                    if (progressEl) progressEl.textContent = 'প্রগ্রেস: ' + adCount + '/' + totalAdsRequired;
                }

                if (adCount >= totalAdsRequired) {
                    adCount = 0;
                    if (currentTopic && currentBtn) unlockTopic(currentTopic, currentBtn);
                } else {
                    setTimeout(function() { showOMGAd(); }, 500);
                }
            }

            function loadUnlockedStatus() {
                var userId = getUserId();
                if (!userId) { renderTopics(); return; }
                fetch(API_BASE + '/user-unlocked/' + userId)
                    .then(function(response) { if (!response.ok) throw new Error('Network error'); return response.json(); })
                    .then(function(data) {
                        unlockedTopics = {};
                        if (data.topics) {
                            data.topics.forEach(function(topicId) { unlockedTopics[topicId] = true; });
                        }
                        renderTopics();
                    })
                    .catch(function(error) { console.error('Error loading unlocked status:', error); renderTopics(); });
            }

            function loadTopics() {
                fetch(API_BASE + '/topics')
                    .then(function(response) { if (!response.ok) throw new Error('Network error'); return response.json(); })
                    .then(function(data) {
                        topics = data;
                        loadUnlockedStatus();
                    })
                    .catch(function(error) {
                        console.error('Error loading topics:', error);
                        document.getElementById('loading').textContent = '❌ টপিক লোড করতে সমস্যা হয়েছে';
                    });
            }

            function init() {
                document.getElementById('user-name').textContent = getUserName();
                loadTopics();
            }

            setInterval(function() { loadUnlockedStatus(); }, 60000);
            setTimeout(init, 100);
        })();
    </script>
</body>
</html>
