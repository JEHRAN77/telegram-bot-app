<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ভিডিও টপিক</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            min-height: 100vh;
        }
        #app {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 80px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #272727;
            margin-bottom: 16px;
        }
        header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }
        #user-info {
            font-size: 14px;
            color: #aaaaaa;
        }
        #loading {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 16px;
        }
        #topic-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .topic-card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #272727;
            display: flex;
            flex-direction: column;
        }
        .thumbnail-container {
            position: relative;
            background: #2a2a2a;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .lock-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
        }
        .lock-icon.unlocked {
            background: rgba(34, 197, 94, 0.8);
        }
        .video-count-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.7);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            color: #fff;
        }
        .topic-info {
            padding: 10px 12px 8px 12px;
            flex: 1;
        }
        .topic-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .topic-meta {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .topic-actions {
            padding: 0 12px 12px 12px;
        }
        .btn-ad {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-ad:active {
            transform: scale(0.97);
        }
        .btn-ad:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-ad.watch {
            background: #dc2626;
        }
        .btn-ad.watch:active {
            background: #b91c1c;
        }
        .btn-ad.unlocked {
            background: #22c55e;
        }
        .btn-ad.unlocked:active {
            background: #16a34a;
        }
        .btn-ad.watching {
            background: #f59e0b;
        }
        .ad-progress {
            font-size: 12px;
            color: #fbbf24;
            text-align: center;
            margin-top: 6px;
        }
        .timeout-badge {
            font-size: 10px;
            color: #f87171;
            margin-top: 2px;
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 480px) {
            #topic-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .topic-title {
                font-size: 12px !important;
            }
            header h1 {
                font-size: 17px;
            }
            .btn-ad {
                font-size: 12px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>📹 ভিডিও টপিক</h1>
            <div id="user-info">
                <span id="user-name"></span>
            </div>
        </header>
        <div id="loading">⏳ লোড হচ্ছে...</div>
        <div id="topic-grid"></div>
    </div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        (function() {
            'use strict';
            
            console.log('App started - Simulation Mode');
            
            var Telegram = null;
            try {
                Telegram = window.Telegram.WebApp;
                if (Telegram) {
                    Telegram.ready();
                    console.log('Telegram WebApp ready');
                }
            } catch (e) {
                console.log('Telegram WebApp not available');
            }

            var API_BASE = '/api';
            var topics = [];
            var unlockedTopics = {};
            var isAdWatching = false;
            var adTimers = {};

            function getUserId() {
                try {
                    if (Telegram && Telegram.initDataUnsafe && Telegram.initDataUnsafe.user) {
                        return Telegram.initDataUnsafe.user.id;
                    }
                    return null;
                } catch (e) {
                    return null;
                }
            }

            function getUserName() {
                try {
                    if (Telegram && Telegram.initDataUnsafe && Telegram.initDataUnsafe.user) {
                        return Telegram.initDataUnsafe.user.first_name || 'ইউজার';
                    }
                    return 'ইউজার';
                } catch (e) {
                    return 'ইউজার';
                }
            }

            function getThumbnailUrl(topic) {
                if (topic.thumbnail) {
                    return API_BASE + '/thumbnail/' + topic.thumbnail;
                }
                if (topic.thumbnails && topic.thumbnails.length > 0) {
                    return API_BASE + '/thumbnail/' + topic.thumbnails[0];
                }
                return null;
            }

            function isTopicUnlocked(topicId) {
                return unlockedTopics[topicId] === true;
            }

            function renderTopics() {
                var grid = document.getElementById('topic-grid');
                var loading = document.getElementById('loading');
                
                if (!topics || topics.length === 0) {
                    loading.textContent = '📭 এখনো কোনো টপিক যোগ করা হয়নি';
                    return;
                }
                
                loading.style.display = 'none';
                grid.innerHTML = '';
                
                topics.forEach(function(topic) {
                    var card = document.createElement('div');
                    card.className = 'topic-card';
                    var videoCount = topic.videoCount || (topic.videos ? topic.videos.length : 0);
                    var thumbUrl = getThumbnailUrl(topic);
                    var adsRequired = topic.adsRequired || 0;
                    var topicUnlocked = isTopicUnlocked(topic.id);
                    
                    var thumbnailHtml = '';
                    if (thumbUrl) {
                        thumbnailHtml = '<img src="' + thumbUrl + '" alt="' + (topic.title || 'টপিক') + '" onerror="this.style.display=\'none\'">';
                    }
                    
                    var btnHtml = '';
                    if (topicUnlocked) {
                        btnHtml = '<button class="btn-ad unlocked" disabled>✅ আনলক করা আছে</button>';
                    } else {
                        btnHtml = '<button class="btn-ad watch" data-topic-id="' + topic.id + '" data-ads="' + adsRequired + '">🎬 ' + adsRequired + 'টি অ্যাড দেখে আনলক করুন</button>';
                    }
                    
                    card.innerHTML = `
                        <div class="thumbnail-container">
                            ${thumbnailHtml}
                            <span style="font-size:40px; ${thumbUrl ? 'display:none;' : ''}">📹</span>
                            <div class="lock-icon ${topicUnlocked ? 'unlocked' : ''}">${topicUnlocked ? '🔓' : '🔒'}</div>
                            <div class="video-count-badge">📹 ${videoCount}</div>
                        </div>
                        <div class="topic-info">
                            <div class="topic-title">${topic.title || 'নামবিহীন টপিক'}</div>
                            <div class="topic-meta">🔢 ${adsRequired}টি অ্যাড দেখে আনলক করুন</div>
                            ${topicUnlocked ? '<div class="timeout-badge">⏳ ৩০ মিনিট পর আবার লক হবে</div>' : ''}
                        </div>
                        <div class="topic-actions">
                            ${btnHtml}
                            <div class="ad-progress" id="progress-${topic.id}"></div>
                        </div>
                    `;
                    
                    grid.appendChild(card);
                    
                    var btn = card.querySelector('.btn-ad.watch');
                    if (btn) {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            var topicId = this.getAttribute('data-topic-id');
                            var topicObj = topics.find(function(t) { return t.id === topicId; });
                            if (topicObj) {
                                startWatchingAd(topicObj, this);
                            }
                        });
                    }
                });
            }

            function unlockTopic(topic, btnElement) {
                unlockedTopics[topic.id] = true;
                
                btnElement.textContent = '✅ আনলক করা আছে';
                btnElement.className = 'btn-ad unlocked';
                btnElement.disabled = true;
                
                var progressEl = document.getElementById('progress-' + topic.id);
                if (progressEl) {
                    progressEl.textContent = '🎉 টপিকটি আনলক হয়েছে! (৩০ মিনিটের জন্য)';
                }
                
                isAdWatching = false;
                
                var card = btnElement.closest('.topic-card');
                var lockIcon = card.querySelector('.lock-icon');
                if (lockIcon) {
                    lockIcon.textContent = '🔓';
                    lockIcon.className = 'lock-icon unlocked';
                }
                
                var timeoutBadge = card.querySelector('.timeout-badge');
                if (!timeoutBadge) {
                    var infoDiv = card.querySelector('.topic-info');
                    var badge = document.createElement('div');
                    badge.className = 'timeout-badge';
                    badge.textContent = '⏳ ৩০ মিনিট পর আবার লক হবে';
                    infoDiv.appendChild(badge);
                }
                
                var userId = getUserId();
                if (userId) {
                    fetch(API_BASE + '/unlock-topic', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: userId,
                            topicId: topic.id
                        })
                    }).then(function(response) {
                        return response.json();
                    }).then(function(data) {
                        console.log('Unlock response:', data);
                    }).catch(function(err) {
                        console.error('Unlock error:', err);
                    });
                }
            }

            function startWatchingAd(topic, btnElement) {
                if (isAdWatching) return;
                if (adTimers[topic.id]) return;
                
                var totalAds = topic.adsRequired || 0;
                var adsWatched = 0;
                isAdWatching = true;
                
                btnElement.disabled = true;
                btnElement.className = 'btn-ad watching';
                btnElement.textContent = '⏳ অ্যাড দেখছেন... (সিমুলেশন)';
                
                var progressEl = document.getElementById('progress-' + topic.id);
                if (progressEl) {
                    progressEl.textContent = 'প্রগ্রেস: 0/' + totalAds;
                }
                
                adTimers[topic.id] = setInterval(function() {
                    adsWatched++;
                    if (progressEl) {
                        progressEl.textContent = 'প্রগ্রেস: ' + adsWatched + '/' + totalAds;
                    }
                    
                    if (adsWatched >= totalAds) {
                        clearInterval(adTimers[topic.id]);
                        delete adTimers[topic.id];
                        unlockTopic(topic, btnElement);
                    }
                }, 2000);
            }

            function loadUnlockedStatus() {
                var userId = getUserId();
                if (!userId) {
                    renderTopics();
                    return;
                }
                
                fetch(API_BASE + '/user-unlocked/' + userId)
                    .then(function(response) {
                        if (!response.ok) throw new Error('Network error');
                        return response.json();
                    })
                    .then(function(data) {
                        console.log('Unlocked topics:', data);
                        unlockedTopics = {};
                        if (data.topics) {
                            data.topics.forEach(function(topicId) {
                                unlockedTopics[topicId] = true;
                            });
                        }
                        renderTopics();
                    })
                    .catch(function(error) {
                        console.error('Error loading unlocked status:', error);
                        renderTopics();
                    });
            }

            function loadTopics() {
                fetch(API_BASE + '/topics')
                    .then(function(response) {
                        if (!response.ok) throw new Error('Network error');
                        return response.json();
                    })
                    .then(function(data) {
                        console.log('Topics loaded:', data.length);
                        topics = data;
                        loadUnlockedStatus();
                    })
                    .catch(function(error) {
                        console.error('Error loading topics:', error);
                        document.getElementById('loading').textContent = '❌ টপিক লোড করতে সমস্যা হয়েছে';
                    });
            }

            function init() {
                var name = getUserName();
                document.getElementById('user-name').textContent = name;
                loadTopics();
            }

            // প্রতি 60 সেকেন্ড পর পর রিফ্রেশ
            setInterval(function() {
                loadUnlockedStatus();
            }, 60000);

            setTimeout(init, 100);
        })();
    </script>
</body>
</html>
