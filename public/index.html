<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📹 ভিডিও টপিক</title>
    <script src="//libtl.com/sdk.js" data-zone="11737734" data-sdk="show_11737734"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#0A0A0E;
            --surface:#15151C;
            --surface-alt:#1F1F29;
            --border:#232330;
            --text:#F5F5F7;
            --text-dim:#8B8B96;
            --brand:#FF3B30;
            --gold:#F5B301;
            --gold-dark:#C98A00;
            --gold-ink:#241A00;
            --success:#34D399;
        }
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

        /* Header */
        header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:rgba(10,10,14,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
        header .logo{font-size:17px;font-weight:700;letter-spacing:-.2px;color:var(--text)}
        header .logo span{color:var(--brand)}
        header .profile{display:flex;align-items:center;gap:10px}
        header .profile .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#B3261E);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;overflow:hidden}
        header .profile .username{font-size:13px;color:var(--text-dim);display:none}
        @media(min-width:480px){header .profile .username{display:block}}

        /* Categories */
        .categories{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;background:var(--bg);border-bottom:1px solid var(--border)}
        .categories::-webkit-scrollbar{display:none}
        .categories .tab{padding:7px 16px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text-dim);background:var(--surface);white-space:nowrap;cursor:pointer;transition:background .2s ease,color .2s ease;border:1px solid var(--border)}
        .categories .tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
        .categories .tab:active{transform:scale(.96)}

        /* Grid */
        #topic-grid{display:grid;grid-template-columns:1fr;gap:14px;padding:16px;padding-bottom:80px}
        @media(min-width:768px){#topic-grid{grid-template-columns:1fr 1fr;gap:16px}}

        /* Card */
        .topic-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
        .thumbnail-container{position:relative;aspect-ratio:16/9;background:var(--surface-alt);overflow:hidden}
        .thumbnail-container img{width:100%;height:100%;object-fit:cover;display:block}
        .thumbnail-container .lock-icon{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);border-radius:8px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px}
        .thumbnail-container .lock-icon.unlocked{background:rgba(52,211,153,.85)}
        .thumbnail-container .count-badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:600;color:#fff;display:flex;align-items:center;gap:3px}

        /* Info */
        .video-info{padding:12px 14px 10px 14px}
        .video-info .title{font-size:15px;font-weight:600;line-height:1.35;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.video-meta{display:flex;align-items:center;gap:10px;margin-top:7px;color:var(--text-dim);font-size:12px}.video-meta span{display:inline-flex;align-items:center;gap:3px}

        /* Button */
        .topic-actions{padding:0 14px 14px 14px}
        .btn-unlock{width:100%;padding:12px;border:none;border-radius:10px;font-size:14.5px;font-weight:600;cursor:pointer;transition:opacity .2s ease,transform .15s ease;display:flex;align-items:center;justify-content:center;gap:6px}
        .btn-unlock{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--gold-ink)}
        .btn-unlock:active{transform:scale(.97)}
        .btn-unlock:disabled{opacity:.65;cursor:not-allowed}
        .btn-unlock.unlocked{background:rgba(52,211,153,.14);color:var(--success);border:1px solid rgba(52,211,153,.35)}
        .btn-unlock.watching{background:var(--surface-alt);color:var(--text-dim);border:1px solid var(--border)}
        .btn-unlock .progress{font-variant-numeric:tabular-nums}

        /* Loading */
        #loading{text-align:center;padding:60px 20px;color:var(--text-dim);font-size:14.5px}

        /* Ad Overlay */
        #ad-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:rgba(6,6,9,.96);justify-content:center;align-items:center;flex-direction:column;padding:20px}
        #ad-overlay.show{display:flex}
        #ad-overlay .ad-content{width:100%;max-width:360px;text-align:center}
        #ad-overlay .ad-timer{color:var(--text);font-size:44px;font-weight:700;margin:14px 0;font-variant-numeric:tabular-nums}
        #ad-overlay .ad-timer span{color:var(--gold)}
        #ad-overlay .ad-label{color:var(--text-dim);font-size:14.5px;letter-spacing:.2px}
        #ad-overlay .ad-skip-btn{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--gold-ink);border:none;border-radius:10px;padding:13px 28px;font-size:16px;font-weight:600;cursor:pointer;display:none;margin-top:18px}
        #ad-overlay .ad-skip-btn.show{display:inline-block}

        @media(max-width:480px){header .logo{font-size:15px}.video-info .title{font-size:14px}.btn-unlock{font-size:13.5px;padding:11px}#ad-overlay .ad-timer{font-size:34px}}
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">📹 <span>Viral</span>Zone</div>
        <div class="profile">
            <span class="username" id="userNameDisplay">ইউজার</span>
            <div class="avatar" id="avatarDisplay">
                <span id="avatarText">U</span>
            </div>
        </div>
    </header>

    <!-- Categories -->
    <div class="categories">
        <button class="tab active" data-category="all">সব</button>
        <button class="tab" data-category="trending">ট্রেন্ডিং</button>
        <button class="tab" data-category="new">নতুন</button>
        <button class="tab" data-category="popular">জনপ্রিয়</button>
    </div>

    <!-- Grid -->
    <div id="loading">⏳ লোড হচ্ছে...</div>
    <div id="topic-grid"></div>

    <!-- Ad Overlay -->
    <div id="ad-overlay">
        <div class="ad-content">
            <div class="ad-label">⏳ অ্যাড দেখুন</div>
            <div class="ad-timer"><span id="adTimer">• • •</span></div>
            <button class="ad-skip-btn" id="adSkipBtn" disabled style="display:none">অপেক্ষা করুন...</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        (function() {
            'use strict';
            console.log('App started');

            var Telegram = null;
            try {
                Telegram = window.Telegram.WebApp;
                if (Telegram) Telegram.ready();
            } catch (e) {}

            // ===== User Info =====
            function getUserName() {
                try {
                    if (Telegram && Telegram.initDataUnsafe && Telegram.initDataUnsafe.user) {
                        return Telegram.initDataUnsafe.user.first_name || 'ইউজার';
                    }
                    return 'ইউজার';
                } catch (e) { return 'ইউজার'; }
            }

            function getUserId() {
                try {
                    if (Telegram && Telegram.initDataUnsafe && Telegram.initDataUnsafe.user) {
                        return Telegram.initDataUnsafe.user.id;
                    }
                    return null;
                } catch (e) { return null; }
            }

            var userName = getUserName();
            document.getElementById('userNameDisplay').textContent = userName;
            document.getElementById('avatarText').textContent = userName.charAt(0).toUpperCase();

            // ===== API =====
            var API_BASE = '/api';
            var topics = [];
            var unlockedTopics = {};
            var isWatching = false;
            var currentTopic = null;
            var currentBtn = null;
            var timerInterval = null;
            var totalAdsRequired = 0;
            var adCount = 0;
            var adCompleted = false;
            var activeCategory = 'all';

            // ===== Render Topics =====
            function renderTopics() {
                var grid = document.getElementById('topic-grid');
                var loading = document.getElementById('loading');

                if (!topics || topics.length === 0) {
                    loading.textContent = '📭 এখনো কোনো টপিক যোগ করা হয়নি';
                    return;
                }

                loading.style.display = 'none';
                grid.innerHTML = '';

                var sortedTopics = topics.slice();
                function timeOf(topic) {
                    var t = topic && topic.createdAt ? new Date(topic.createdAt).getTime() : 0;
                    return Number.isFinite(t) ? t : 0;
                }
                function unlocksOf(topic) {
                    return Number(topic && (topic.unlockCount || topic.unlocks || topic.views) || 0) || 0;
                }

                // Categories are real filters/sorts, not just visual buttons.
                if (activeCategory === 'popular') {
                    sortedTopics.sort(function(a, b) {
                        return unlocksOf(b) - unlocksOf(a) || timeOf(b) - timeOf(a);
                    });
                } else if (activeCategory === 'trending') {
                    var now = Date.now();
                    sortedTopics.sort(function(a, b) {
                        var ageA = Math.max(0, (now - timeOf(a)) / 86400000);
                        var ageB = Math.max(0, (now - timeOf(b)) / 86400000);
                        var scoreA = unlocksOf(a) * 20 + Math.max(0, 30 - ageA);
                        var scoreB = unlocksOf(b) * 20 + Math.max(0, 30 - ageB);
                        return scoreB - scoreA || timeOf(b) - timeOf(a);
                    });
                } else if (activeCategory === 'new') {
                    // "নতুন": newest uploads first.
                    sortedTopics.sort(function(a, b) {
                        return timeOf(b) - timeOf(a);
                    });
                    sortedTopics = sortedTopics.slice(0, 20);
                } else {
                    // "সব": follow the admin's manual order.
                    sortedTopics.sort(function(a, b) {
                        var orderA = Number.isFinite(Number(a.sortOrder)) ? Number(a.sortOrder) : timeOf(a);
                        var orderB = Number.isFinite(Number(b.sortOrder)) ? Number(b.sortOrder) : timeOf(b);
                        return orderB - orderA;
                    });
                }

                if (sortedTopics.length === 0) {
                    loading.style.display = 'block';
                    loading.textContent = '📭 এই ক্যাটাগরিতে এখনো কোনো ভিডিও নেই';
                    return;
                }

                sortedTopics.forEach(function(topic) {
                    var card = document.createElement('div');
                    card.className = 'topic-card';

                    var videoCount = topic.videoCount || (topic.videos ? topic.videos.length : 0);
                    var thumbUrl = topic.thumbnail ? API_BASE + '/thumbnail/' + topic.thumbnail : null;
                    var adsRequired = Math.max(1, Number(topic.adsRequired) || 1);
                    var views = Math.max(0, Number(topic.unlockCount || topic.unlocks || topic.views) || 0);
                    var topicUnlocked = unlockedTopics[topic.id] === true;

                    var thumbnailHtml = '';
                    if (thumbUrl) {
                        thumbnailHtml = '<img src="' + thumbUrl + '" alt="' + (topic.title || 'টপিক') +
                            '" onerror="this.parentElement.innerHTML=\'<span style=\'font-size:40px;\'>📹</span>\'">';
                    } else {
                        thumbnailHtml = '<span style="font-size:40px;color:#555;">📹</span>';
                    }

                    var lockIcon = topicUnlocked ? '🔓' : '🔒';
                    var lockClass = topicUnlocked ? 'lock-icon unlocked' : 'lock-icon';

                    var btnHtml = '';
                    if (topicUnlocked) {
                        btnHtml = '<button class="btn-unlock unlocked" disabled>✅ আনলক করা আছে</button>';
                    } else {
                        btnHtml = '<button class="btn-unlock" data-topic-id="' + topic.id + '" data-ads="' +
                            adsRequired + '">🔓 ' + adsRequired + 'টি অ্যাড দেখে আনলক করুন</button>';
                    }

                    card.innerHTML = `
                        <div class="thumbnail-container">
                            ${thumbnailHtml}
                            <div class="${lockClass}">${lockIcon}</div>
                            <div class="count-badge">📹 ${videoCount}</div>
                        </div>
                        <div class="video-info">
                            <div class="title">${topic.title || 'নামবিহীন টপিক'}</div>
                            <div class="video-meta"><span>👁️ ${views} ভিউ</span><span>🔢 ${adsRequired} Ads</span></div>
                        </div>
                        <div class="topic-actions">
                            ${btnHtml}
                        </div>
                    `;

                    grid.appendChild(card);

                    var btn = card.querySelector('.btn-unlock');
                    if (btn && !topicUnlocked) {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            var topicId = this.getAttribute('data-topic-id');
                            var topicObj = topics.find(function(t) { return t.id === topicId; });
                            if (topicObj) {
                                currentBtn = this;
                                startAdWatch(topicObj);
                            }
                        });
                    }
                });
            }

            // ===== Rewarded Ads =====
            // প্রতিটি ad-এর completion শুধু SDK Promise resolve হলে গণনা হবে।
            // কোনো fake timer/timeout দিয়ে ad complete ধরা হবে না।
            function startAdWatch(topic) {
                if (isWatching) return;

                totalAdsRequired = Math.max(1, parseInt(topic.adsRequired, 10) || 1);
                if (adCount >= totalAdsRequired) adCount = 0;
                currentTopic = topic;
                isWatching = true;
                adCompleted = false;

                if (currentBtn) {
                    currentBtn.innerHTML = '⏳ অ্যাড চালু হচ্ছে... <span class="progress">(' + adCount + '/' + totalAdsRequired + ')</span>';
                    currentBtn.className = 'btn-unlock watching';
                    currentBtn.disabled = true;
                }

                var overlay = document.getElementById('ad-overlay');
                var skipBtn = document.getElementById('adSkipBtn');
                var timerDisplay = document.getElementById('adTimer');
                var label = overlay.querySelector('.ad-label');

                overlay.classList.add('show');
                skipBtn.className = 'ad-skip-btn';
                skipBtn.disabled = true;
                skipBtn.onclick = null;
                timerDisplay.textContent = '• • •';
                label.textContent = '⏳ অ্যাড সম্পূর্ণ হওয়া পর্যন্ত অপেক্ষা করুন';

                // পুরোনো fallback timer বন্ধ রাখা হয়েছে।
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }

                var adFn = window.show_11737734;
                if (typeof adFn !== 'function') {
                    console.error('❌ Rewarded ad SDK is not ready');
                    resetAd('⚠️ অ্যাড লোড হয়নি। কিছুক্ষণ পর আবার চেষ্টা করুন।');
                    return;
                }

                try {
                    Promise.resolve(adFn()).then(function(result) {
                        // Rewarded ad: count only when SDK reports completion.
                        // Some wrappers resolve without a result, so that is also accepted.
                        if (result && result.done === false) {
                            resetAd('⚠️ অ্যাড সম্পূর্ণ হয়নি।');
                            return;
                        }
                        adCompleted = true;
                        onAdComplete();
                    }).catch(function(error) {
                        console.error('❌ Ad error:', error);
                        resetAd('⚠️ অ্যাড চালু হয়নি। আবার চেষ্টা করুন।');
                    });
                } catch (error) {
                    console.error('❌ Ad init error:', error);
                    resetAd('⚠️ অ্যাড চালু হয়নি। আবার চেষ্টা করুন।');
                }
            }

            async function onAdComplete() {
                if (!adCompleted || !isWatching || !currentTopic) return;

                adCompleted = false;
                var topic = currentTopic;
                var overlay = document.getElementById('ad-overlay');
                overlay.classList.remove('show');
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }

                try {
                    var response = await fetch(API_BASE + '/ad-complete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: getUserId(),
                            topicId: topic.id
                        })
                    });
                    var result = await response.json();
                    if (!response.ok || !result.success) throw new Error(result.error || 'Ad completion failed');

                    adCount = Number(result.count) || 0;
                    totalAdsRequired = Number(result.required) || totalAdsRequired;

                    if (currentBtn) {
                        currentBtn.innerHTML = result.unlocked
                            ? '🔓 ভিডিও আনলক হচ্ছে...'
                            : '⏳ অ্যাড দেখা হয়েছে <span class="progress">(' + adCount + '/' + totalAdsRequired + ')</span>';
                    }

                    if (result.unlocked) {
                        isWatching = false;
                        adCount = 0;
                        await loadUnlockedStatus();
                        return;
                    }

                    isWatching = false;
                    setTimeout(function() {
                        if (currentTopic && !unlockedTopics[currentTopic.id]) startAdWatch(currentTopic);
                    }, 500);
                } catch (error) {
                    console.error('❌ Could not record ad completion:', error);
                    resetAd('সার্ভারে Ads count সেভ হয়নি। আবার চেষ্টা করুন।');
                }
            }

            function resetAd(message) {
                var overlay = document.getElementById('ad-overlay');
                var skipBtn = document.getElementById('adSkipBtn');
                var timerDisplay = document.getElementById('adTimer');
                var label = overlay.querySelector('.ad-label');

                overlay.classList.remove('show');
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                skipBtn.className = 'ad-skip-btn';
                skipBtn.disabled = true;
                skipBtn.onclick = null;
                timerDisplay.textContent = '0';
                label.textContent = '⏳ অ্যাড দেখুন';

                if (currentBtn) {
                    currentBtn.textContent = '🔓 ' + totalAdsRequired + 'টি অ্যাড দেখে আনলক করুন' + (message ? ' — আবার চেষ্টা করুন' : '');
                    currentBtn.className = 'btn-unlock';
                    currentBtn.disabled = false;
                }
                isWatching = false;
                adCompleted = false;
            }

            // ===== Load Data =====
            function loadUnlockedStatus() {
                var userId = getUserId();
                if (!userId) { renderTopics(); return; }

                fetch(API_BASE + '/user-unlocked/' + userId)
                    .then(function(response) {
                        if (!response.ok) throw new Error('Network error');
                        return response.json();
                    })
                    .then(function(data) {
                        unlockedTopics = {};
                        if (data.topics) {
                            data.topics.forEach(function(topicId) {
                                unlockedTopics[topicId] = true;
                            });
                        }
                        renderTopics();
                    })
                    .catch(function(error) {
                        console.error('Error loading unlocked status:', error);
                        renderTopics();
                    });
            }

            function loadTopics() {
                fetch(API_BASE + '/topics')
                    .then(function(response) {
                        if (!response.ok) throw new Error('Network error');
                        return response.json();
                    })
                    .then(function(data) {
                        console.log('Topics loaded:', data.length);
                        topics = data;
                        loadUnlockedStatus();
                    })
                    .catch(function(error) {
                        console.error('Error loading topics:', error);
                        document.getElementById('loading').textContent = '❌ টপিক লোড করতে সমস্যা হয়েছে';
                    });
            }

            // ===== Categories =====
            document.querySelectorAll('.tab').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(function(t) {
                        t.classList.remove('active');
                    });
                    this.classList.add('active');
                    activeCategory = this.getAttribute('data-category') || 'all';
                    renderTopics();
                });
            });

            // ===== Init =====
            setInterval(function() {
                loadUnlockedStatus();
            }, 60000);

            setTimeout(loadTopics, 100);
        })();
    </script>
</body>
</html>
