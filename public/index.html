<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📹 ভিডিও টপিক</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            min-height: 100vh;
        }

        /* ===== Header ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #0f0f0f;
            border-bottom: 1px solid #272727;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header .logo {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }
        header .logo span {
            color: #ff0000;
        }
        header .profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        header .profile .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2b7fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            overflow: hidden;
        }
        header .profile .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        header .profile .username {
            font-size: 14px;
            color: #aaa;
            display: none;
        }
        @media (min-width: 480px) {
            header .profile .username {
                display: block;
            }
        }

        /* ===== Category Tabs ===== */
        .categories {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            scrollbar-width: none;
            background: #0f0f0f;
            border-bottom: 1px solid #1a1a1a;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .categories .tab {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: #aaa;
            background: #1a1a1a;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }
        .categories .tab.active {
            background: #fff;
            color: #0f0f0f;
        }
        .categories .tab:active {
            transform: scale(0.95);
        }

        /* ===== Topic Grid ===== */
        #topic-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            padding: 16px;
            padding-bottom: 80px;
        }

        /* ===== Topic Card ===== */
        .topic-card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease;
            cursor: pointer;
        }
        .topic-card:active {
            transform: scale(0.98);
        }

        /* Thumbnail */
        .thumbnail-container {
            position: relative;
            aspect-ratio: 16/9;
            background: #2a2a2a;
            overflow: hidden;
        }
        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .thumbnail-container .lock-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
        }
        .thumbnail-container .lock-icon.unlocked {
            background: rgba(34, 197, 94, 0.8);
        }

        /* Video Info */
        .video-info {
            padding: 12px 14px;
        }
        .video-info .title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-info .channel-name {
            font-size: 13px;
            color: #aaa;
            margin-top: 4px;
        }
        .video-info .meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }
        .video-info .meta .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #888;
        }

        /* Unlock Progress */
        .unlock-progress {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px 14px 14px;
            border-top: 1px solid #272727;
        }
        .unlock-progress .progress-bar {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: #2a2a2a;
            overflow: hidden;
        }
        .unlock-progress .progress-bar .fill {
            height: 100%;
            border-radius: 2px;
            background: #ff0000;
            transition: width 0.5s ease;
        }
        .unlock-progress .progress-bar .fill.done {
            background: #22c55e;
        }
        .unlock-progress .label {
            font-size: 12px;
            color: #aaa;
            white-space: nowrap;
        }

        /* ===== Ad Overlay ===== */
        #ad-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        #ad-overlay.show {
            display: flex;
        }
        #ad-overlay .ad-content {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        #ad-overlay .ad-content iframe {
            width: 100%;
            height: 60vh;
            border: none;
            border-radius: 12px;
            background: #1a1a1a;
        }
        #ad-overlay .ad-timer {
            color: #fff;
            font-size: 48px;
            font-weight: 700;
            margin: 16px 0;
        }
        #ad-overlay .ad-timer span {
            color: #ff0000;
        }
        #ad-overlay .ad-label {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 10px;
        }
        #ad-overlay .ad-skip-btn {
            background: #22c55e;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            margin-top: 16px;
        }
        #ad-overlay .ad-skip-btn.show {
            display: inline-block;
        }

        /* ===== Loading ===== */
        #loading {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 16px;
        }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            header .logo {
                font-size: 16px;
            }
            .video-info .title {
                font-size: 14px;
            }
            .unlock-progress .label {
                font-size: 11px;
            }
            #ad-overlay .ad-timer {
                font-size: 36px;
            }
            #ad-overlay .ad-content iframe {
                height: 50vh;
            }
        }
        @media (min-width: 768px) {
            #topic-grid {
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="logo">📹 <span>Viral</span> Zone</div>
        <div class="profile" id="profileSection">
            <span class="username" id="userNameDisplay">ইউজার</span>
            <div class="avatar" id="avatarDisplay">
                <span id="avatarText">U</span>
            </div>
        </div>
    </header>

    <!-- ===== CATEGORIES ===== -->
    <div class="categories" id="categoryTabs">
        <button class="tab active" data-category="all">সব</button>
        <button class="tab" data-category="trending">ট্রেন্ডিং</button>
        <button class="tab" data-category="new">নতুন</button>
        <button class="tab" data-category="popular">জনপ্রিয়</button>
    </div>

    <!-- ===== TOPIC GRID ===== -->
    <div id="loading">⏳ লোড হচ্ছে...</div>
    <div id="topic-grid"></div>

    <!-- ===== AD OVERLAY ===== -->
    <div id="ad-overlay">
        <div class="ad-content">
            <div class="ad-label">⏳ অ্যাড দেখুন</div>
            <iframe id="adIframe" src=""></iframe>
            <div class="ad-timer"><span id="adTimer">0</span> সেকেন্ড</div>
            <button class="ad-skip-btn" id="adSkipBtn">✅ অ্যাড শেষ! আনলক করুন</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        (function() {
            'use strict';

            console.log('App started - YouTube Style');

            var Telegram = null;
            try {
                Telegram = window.Telegram.WebApp;
                if (Telegram) {
                    Telegram.ready();
                    console.log('Telegram WebApp ready');
                }
            } catch (e) {
                console.log('Telegram WebApp not available');
            }

            // =============================================
            // USER INFO
            // =============================================
            function getUserName() {
                try {
                    if (Telegram && Telegram.initDataUnsafe && Telegram.initDataUnsafe.user) {
                        return Telegram.initDataUnsafe.user.first_name || 'ইউজার';
                    }
                    return 'ইউজার';
                } catch (e) {
                    return 'ইউজার';
                }
            }

            function getUserId() {
                try {
                    if (Telegram && Telegram.initDataUnsafe && Telegram.initDataUnsafe.user) {
                        return Telegram.initDataUnsafe.user.id;
                    }
                    return null;
                } catch (e) {
                    return null;
                }
            }

            // =============================================
            // DISPLAY USER INFO
            // =============================================
            var userName = getUserName();
            document.getElementById('userNameDisplay').textContent = userName;
            document.getElementById('avatarText').textContent = userName.charAt(0).toUpperCase();

            // =============================================
            // API & STATE
            // =============================================
            var API_BASE = '/api';
            var topics = [];
            var unlockedTopics = {};
            var isWatching = false;
            var currentTopic = null;
            var currentBtn = null;
            var timerInterval = null;
            var totalAdsRequired = 0;
            var adCount = 0;

            var AD_LINK = 'https://www.profitableratecpmnetwork.com/rispia5p4?key=7f0f8316968997cb73fa9559c2c685a3';

            // =============================================
            // RENDER TOPICS (YouTube Style)
            // =============================================
            function renderTopics() {
                var grid = document.getElementById('topic-grid');
                var loading = document.getElementById('loading');

                if (!topics || topics.length === 0) {
                    loading.textContent = '📭 এখনো কোনো টপিক যোগ করা হয়নি';
                    return;
                }

                loading.style.display = 'none';
                grid.innerHTML = '';

                topics.forEach(function(topic) {
                    var card = document.createElement('div');
                    card.className = 'topic-card';

                    var videoCount = topic.videoCount || (topic.videos ? topic.videos.length : 0);
                    var thumbUrl = topic.thumbnail ? API_BASE + '/thumbnail/' + topic.thumbnail : null;
                    var adsRequired = topic.adsRequired || 0;
                    var topicUnlocked = unlockedTopics[topic.id] === true;

                    var thumbnailHtml = '';
                    if (thumbUrl) {
                        thumbnailHtml = '<img src="' + thumbUrl + '" alt="' + (topic.title || 'টপিক') +
                            '" onerror="this.parentElement.innerHTML=\'<span style=\'font-size:40px;\'>📹</span>\'">';
                    } else {
                        thumbnailHtml = '<span style="font-size:40px;color:#555;">📹</span>';
                    }

                    var lockIcon = topicUnlocked ? '🔓' : '🔒';
                    var lockClass = topicUnlocked ? 'lock-icon unlocked' : 'lock-icon';

                    var progressPercent = topicUnlocked ? 100 : 0;
                    var progressText = topicUnlocked ?
                        '✅ আনলক করা আছে' :
                        '🔒 আনলক করতে ' + adsRequired + 'টি অ্যাড দেখুন';

                    card.innerHTML = `
                        <div class="thumbnail-container">
                            ${thumbnailHtml}
                            <div class="${lockClass}">${lockIcon}</div>
                        </div>
                        <div class="video-info">
                            <div class="title">${topic.title || 'নামবিহীন টপিক'}</div>
                            <div class="channel-name">📹 ${videoCount}টি ভিডিও</div>
                            <div class="meta">
                                <span>🔢 ${adsRequired}টি অ্যাড</span>
                                <span class="dot"></span>
                                <span>${topicUnlocked ? '✅ আনলকড' : '🔒 লকড'}</span>
                            </div>
                        </div>
                        <div class="unlock-progress">
                            <div class="progress-bar">
                                <div class="fill ${topicUnlocked ? 'done' : ''}" style="width:${progressPercent}%;"></div>
                            </div>
                            <span class="label">${progressText}</span>
                        </div>
                    `;

                    // ক্লিক করলে অ্যাড দেখাবে (যদি লকড থাকে)
                    if (!topicUnlocked) {
                        card.addEventListener('click', function(e) {
                            e.stopPropagation();
                            startAdWatch(topic, card);
                        });
                    }

                    grid.appendChild(card);
                });
            }

            // =============================================
            // AD WATCH SYSTEM
            // =============================================
            function startAdWatch(topic, card) {
                if (isWatching) return;

                totalAdsRequired = topic.adsRequired || 1;
                adCount = 0;
                currentTopic = topic;
                isWatching = true;

                showAd();
            }

            function showAd() {
                var overlay = document.getElementById('ad-overlay');
                var iframe = document.getElementById('adIframe');
                var skipBtn = document.getElementById('adSkipBtn');
                var timerDisplay = document.getElementById('adTimer');

                var totalTime = 15;
                var timeLeft = totalTime;

                overlay.classList.add('show');
                iframe.src = AD_LINK;
                skipBtn.className = 'ad-skip-btn';
                skipBtn.disabled = true;
                timerDisplay.textContent = timeLeft;

                if (timerInterval) clearInterval(timerInterval);

                timerInterval = setInterval(function() {
                    timeLeft--;
                    timerDisplay.textContent = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        skipBtn.className = 'ad-skip-btn show';
                        skipBtn.disabled = false;
                        timerDisplay.textContent = '✅';
                        skipBtn.onclick = function() {
                            onAdComplete();
                        };
                    }
                }, 1000);
            }

            function onAdComplete() {
                var overlay = document.getElementById('ad-overlay');
                var iframe = document.getElementById('adIframe');

                overlay.classList.remove('show');
                iframe.src = '';
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }

                adCount++;

                if (adCount >= totalAdsRequired) {
                    adCount = 0;
                    unlockTopic(currentTopic);
                } else {
                    setTimeout(function() {
                        showAd();
                    }, 500);
                }
            }

            function unlockTopic(topic) {
                unlockedTopics[topic.id] = true;
                isWatching = false;

                var userId = getUserId();
                if (userId) {
                    fetch(API_BASE + '/unlock-topic', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: userId,
                            topicId: topic.id
                        })
                    }).catch(function(err) {
                        console.error('Unlock error:', err);
                    });
                }

                renderTopics();
            }

            // =============================================
            // LOAD DATA
            // =============================================
            function loadUnlockedStatus() {
                var userId = getUserId();
                if (!userId) {
                    renderTopics();
                    return;
                }

                fetch(API_BASE + '/user-unlocked/' + userId)
                    .then(function(response) {
                        if (!response.ok) throw new Error('Network error');
                        return response.json();
                    })
                    .then(function(data) {
                        unlockedTopics = {};
                        if (data.topics) {
                            data.topics.forEach(function(topicId) {
                                unlockedTopics[topicId] = true;
                            });
                        }
                        renderTopics();
                    })
                    .catch(function(error) {
                        console.error('Error loading unlocked status:', error);
                        renderTopics();
                    });
            }

            function loadTopics() {
                fetch(API_BASE + '/topics')
                    .then(function(response) {
                        if (!response.ok) throw new Error('Network error');
                        return response.json();
                    })
                    .then(function(data) {
                        console.log('Topics loaded:', data.length);
                        topics = data;
                        loadUnlockedStatus();
                    })
                    .catch(function(error) {
                        console.error('Error loading topics:', error);
                        document.getElementById('loading').textContent = '❌ টপিক লোড করতে সমস্যা হয়েছে';
                    });
            }

            // =============================================
            // CATEGORY FILTER
            // =============================================
            document.querySelectorAll('.tab').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(function(t) {
                        t.classList.remove('active');
                    });
                    this.classList.add('active');
                    var cat = this.getAttribute('data-category');
                    filterTopics(cat);
                });
            });

            function filterTopics(category) {
                // ডেমো ফিল্টার - আসলে সব দেখায়
                // আপনি চাইলে এখানে ফিল্টার লজিক যোগ করতে পারেন
                renderTopics();
            }

            // =============================================
            // INIT
            // =============================================
            setInterval(function() {
                loadUnlockedStatus();
            }, 60000);

            setTimeout(loadTopics, 100);
        })();
    </script>
</body>
</html>
