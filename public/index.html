<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📹 ভিডিও টপিক</title>
    <script src="//libtl.com/sdk.js" data-zone="11737734" data-sdk="show_11737734"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#fff;min-height:100vh}
        
        /* Header */
        header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0f0f0f;border-bottom:1px solid #272727;position:sticky;top:0;z-index:10}
        header .logo{font-size:18px;font-weight:700;color:#fff}
        header .logo span{color:#ff0000}
        header .profile{display:flex;align-items:center;gap:10px}
        header .profile .avatar{width:32px;height:32px;border-radius:50%;background:#2b7fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;overflow:hidden}
        header .profile .username{font-size:14px;color:#aaa;display:none}
        @media(min-width:480px){header .profile .username{display:block}}
        
        /* Categories */
        .categories{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;background:#0f0f0f;border-bottom:1px solid #1a1a1a}
        .categories::-webkit-scrollbar{display:none}
        .categories .tab{padding:6px 16px;border-radius:20px;font-size:14px;font-weight:500;color:#aaa;background:#1a1a1a;white-space:nowrap;cursor:pointer;transition:all .3s ease;border:none}
        .categories .tab.active{background:#fff;color:#0f0f0f}
        .categories .tab:active{transform:scale(.95)}
        
        /* Grid */
        #topic-grid{display:grid;grid-template-columns:1fr;gap:16px;padding:16px;padding-bottom:80px}
        @media(min-width:768px){#topic-grid{grid-template-columns:1fr 1fr;gap:20px}}
        
        /* Card */
        .topic-card{background:#1a1a1a;border-radius:12px;overflow:hidden;transition:transform .2s ease}
        .topic-card:active{transform:scale(.98)}
        .thumbnail-container{position:relative;aspect-ratio:16/9;background:#2a2a2a;overflow:hidden}
        .thumbnail-container img{width:100%;height:100%;object-fit:cover}
        .thumbnail-container .lock-icon{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
        .thumbnail-container .lock-icon.unlocked{background:rgba(34,197,94,.8)}
        
        /* Info */
        .video-info{padding:12px 14px}
        .video-info .title{font-size:16px;font-weight:600;line-height:1.3;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .video-info .channel-name{font-size:13px;color:#aaa;margin-top:4px}
        .video-info .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:#888;margin-top:4px}
        .video-info .meta .dot{width:4px;height:4px;border-radius:50%;background:#888}
        
        /* Button */
        .topic-actions{padding:0 14px 14px 14px}
        .btn-unlock{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;transition:all .3s ease;background:#dc2626}
        .btn-unlock:active{transform:scale(.97)}
        .btn-unlock:disabled{opacity:.6;cursor:not-allowed}
        .btn-unlock.unlocked{background:#22c55e}
        .btn-unlock.watching{background:#f59e0b}
        
        /* Loading */
        #loading{text-align:center;padding:40px;color:#888;font-size:16px}
        
        /* Ad Overlay */
        #ad-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:rgba(0,0,0,.9);justify-content:center;align-items:center;flex-direction:column;padding:20px}
        #ad-overlay.show{display:flex}
        #ad-overlay .ad-content{width:100%;max-width:400px;text-align:center}
        #ad-overlay .ad-timer{color:#fff;font-size:48px;font-weight:700;margin:16px 0}
        #ad-overlay .ad-timer span{color:#ff0000}
        #ad-overlay .ad-label{color:#aaa;font-size:16px;margin-bottom:10px}
        #ad-overlay .ad-skip-btn{background:#22c55e;color:#fff;border:none;border-radius:10px;padding:12px 30px;font-size:18px;font-weight:600;cursor:pointer;display:none;margin-top:16px}
        #ad-overlay .ad-skip-btn.show{display:inline-block}
        
        @media(max-width:480px){header .logo{font-size:16px}.video-info .title{font-size:14px}.btn-unlock{font-size:14px;padding:10px}#ad-overlay .ad-timer{font-size:36px}}
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">📹 <span>Viral</span> Zone</div>
        <div class="profile">
            <span class="username" id="userNameDisplay">ইউজার</span>
            <div class="avatar" id="avatarDisplay">
                <span id="avatarText">U</span>
            </div>
        </div>
    </header>

    <!-- Categories -->
    <div class="categories">
        <button class="tab active" data-category="all">সব</button>
        <button class="tab" data-category="trending">ট্রেন্ডিং</button>
        <button class="tab" data-category="new">নতুন</button>
        <button class="tab" data-category="popular">জনপ্রিয়</button>
    </div>

    <!-- Grid -->
    <div id="loading">⏳ লোড হচ্ছে...</div>
    <div id="topic-grid"></div>

    <!-- Ad Overlay -->
    <div id="ad-overlay">
        <div class="ad-content">
            <div class="ad-label">⏳ অ্যাড দেখুন</div>
            <div class="ad-timer"><span id="adTimer">0</span> সেকেন্ড</div>
            <button class="ad-skip-btn" id="adSkipBtn">✅ অ্যাড শেষ! আনলক করুন</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        (function() {
            'use strict';
            console.log('App started');

            var Telegram = null;
            try {
                Telegram = window.Telegram.WebApp;
                if (Telegram) Telegram.ready();
            } catch (e) {}

            // ===== User Info =====
            function getUserName() {
                try {
                    if (Telegram && Telegram.initDataUnsafe && Telegram.initDataUnsafe.user) {
                        return Telegram.initDataUnsafe.user.first_name || 'ইউজার';
                    }
                    return 'ইউজার';
                } catch (e) { return 'ইউজার'; }
            }

            function getUserId() {
                try {
                    if (Telegram && Telegram.initDataUnsafe && Telegram.initDataUnsafe.user) {
                        return Telegram.initDataUnsafe.user.id;
                    }
                    return null;
                } catch (e) { return null; }
            }

            var userName = getUserName();
            document.getElementById('userNameDisplay').textContent = userName;
            document.getElementById('avatarText').textContent = userName.charAt(0).toUpperCase();

            // ===== API =====
            var API_BASE = '/api';
            var topics = [];
            var unlockedTopics = {};
            var isWatching = false;
            var currentTopic = null;
            var currentBtn = null;
            var timerInterval = null;
            var totalAdsRequired = 0;
            var adCount = 0;
            var adCompleted = false;

            // ===== Render Topics =====
            function renderTopics() {
                var grid = document.getElementById('topic-grid');
                var loading = document.getElementById('loading');

                if (!topics || topics.length === 0) {
                    loading.textContent = '📭 এখনো কোনো টপিক যোগ করা হয়নি';
                    return;
                }

                loading.style.display = 'none';
                grid.innerHTML = '';

                topics.forEach(function(topic) {
                    var card = document.createElement('div');
                    card.className = 'topic-card';

                    var videoCount = topic.videoCount || (topic.videos ? topic.videos.length : 0);
                    var thumbUrl = topic.thumbnail ? API_BASE + '/thumbnail/' + topic.thumbnail : null;
                    var adsRequired = topic.adsRequired || 0;
                    var topicUnlocked = unlockedTopics[topic.id] === true;

                    var thumbnailHtml = '';
                    if (thumbUrl) {
                        thumbnailHtml = '<img src="' + thumbUrl + '" alt="' + (topic.title || 'টপিক') +
                            '" onerror="this.parentElement.innerHTML=\'<span style=\'font-size:40px;\'>📹</span>\'">';
                    } else {
                        thumbnailHtml = '<span style="font-size:40px;color:#555;">📹</span>';
                    }

                    var lockIcon = topicUnlocked ? '🔓' : '🔒';
                    var lockClass = topicUnlocked ? 'lock-icon unlocked' : 'lock-icon';

                    var btnHtml = '';
                    if (topicUnlocked) {
                        btnHtml = '<button class="btn-unlock unlocked" disabled>✅ আনলক করা আছে</button>';
                    } else {
                        btnHtml = '<button class="btn-unlock" data-topic-id="' + topic.id + '" data-ads="' +
                            adsRequired + '">🎬 ' + adsRequired + 'টি অ্যাড দেখে আনলক করুন</button>';
                    }

                    card.innerHTML = `
                        <div class="thumbnail-container">
                            ${thumbnailHtml}
                            <div class="${lockClass}">${lockIcon}</div>
                        </div>
                        <div class="video-info">
                            <div class="title">${topic.title || 'নামবিহীন টপিক'}</div>
                            <div class="channel-name">📹 ${videoCount}টি ভিডিও</div>
                            <div class="meta">
                                <span>🔢 ${adsRequired}টি অ্যাড</span>
                                <span class="dot"></span>
                                <span>${topicUnlocked ? '✅ আনলকড' : '🔒 লকড'}</span>
                            </div>
                        </div>
                        <div class="topic-actions">
                            ${btnHtml}
                        </div>
                    `;

                    grid.appendChild(card);

                    var btn = card.querySelector('.btn-unlock');
                    if (btn && !topicUnlocked) {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            var topicId = this.getAttribute('data-topic-id');
                            var topicObj = topics.find(function(t) { return t.id === topicId; });
                            if (topicObj) {
                                currentBtn = this;
                                startAdWatch(topicObj);
                            }
                        });
                    }
                });
            }

            // ===== OMG Rewarded Interstitial =====
            function startAdWatch(topic) {
                if (isWatching) return;

                totalAdsRequired = topic.adsRequired || 1;
                adCount = 0;
                adCompleted = false;
                currentTopic = topic;
                isWatching = true;

                if (currentBtn) {
                    currentBtn.textContent = '⏳ অ্যাড দেখছেন... (0/' + totalAdsRequired + ')';
                    currentBtn.className = 'btn-unlock watching';
                    currentBtn.disabled = true;
                }

                var overlay = document.getElementById('ad-overlay');
                var skipBtn = document.getElementById('adSkipBtn');
                var timerDisplay = document.getElementById('adTimer');

                overlay.classList.add('show');
                skipBtn.className = 'ad-skip-btn';
                skipBtn.disabled = true;
                timerDisplay.textContent = '15';

                // OMG Rewarded Interstitial
                try {
                    show_11737734().then(function() {
                        console.log('✅ Ad completed');
                        adCompleted = true;
                        completeAd();
                    }).catch(function(e) {
                        console.error('❌ Ad error:', e);
                        resetAd();
                    });
                } catch (error) {
                    console.error('❌ Ad init error:', error);
                    resetAd();
                }

                var timeLeft = 15;
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(function() {
                    timeLeft--;
                    timerDisplay.textContent = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        // যদি OMG কাজ না করে, তাহলে টাইমার শেষে আনলক
                        if (!adCompleted) {
                            completeAd();
                        }
                    }
                }, 1000);
            }

            function completeAd() {
                var overlay = document.getElementById('ad-overlay');
                var skipBtn = document.getElementById('adSkipBtn');
                var timerDisplay = document.getElementById('adTimer');

                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }

                skipBtn.className = 'ad-skip-btn show';
                skipBtn.disabled = false;
                timerDisplay.textContent = '✅';
                skipBtn.onclick = function() {
                    onAdComplete();
                };
            }

            function onAdComplete() {
                var overlay = document.getElementById('ad-overlay');
                overlay.classList.remove('show');
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }

                adCount++;

                if (currentBtn) {
                    currentBtn.textContent = '⏳ অ্যাড দেখছেন... (' + adCount + '/' + totalAdsRequired + ')';
                }

                if (adCount >= totalAdsRequired) {
                    adCount = 0;
                    unlockTopic(currentTopic);
                } else {
                    setTimeout(function() {
                        startAdWatch(currentTopic);
                    }, 500);
                }
            }

            function resetAd() {
                var overlay = document.getElementById('ad-overlay');
                overlay.classList.remove('show');
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                if (currentBtn) {
                    currentBtn.textContent = '🎬 ' + totalAdsRequired + 'টি অ্যাড দেখে আনলক করুন';
                    currentBtn.className = 'btn-unlock';
                    currentBtn.disabled = false;
                }
                isWatching = false;
                adCompleted = false;
            }

            function unlockTopic(topic) {
                unlockedTopics[topic.id] = true;
                isWatching = false;
                adCompleted = false;

                if (currentBtn) {
                    currentBtn.textContent = '✅ আনলক করা আছে';
                    currentBtn.className = 'btn-unlock unlocked';
                    currentBtn.disabled = true;
                }

                var userId = getUserId();
                if (userId) {
                    fetch(API_BASE + '/unlock-topic', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: userId, topicId: topic.id })
                    }).catch(function(err) { console.error('Unlock error:', err); });
                }

                renderTopics();
            }

            // ===== Load Data =====
            function loadUnlockedStatus() {
                var userId = getUserId();
                if (!userId) { renderTopics(); return; }

                fetch(API_BASE + '/user-unlocked/' + userId)
                    .then(function(response) {
                        if (!response.ok) throw new Error('Network error');
                        return response.json();
                    })
                    .then(function(data) {
                        unlockedTopics = {};
                        if (data.topics) {
                            data.topics.forEach(function(topicId) {
                                unlockedTopics[topicId] = true;
                            });
                        }
                        renderTopics();
                    })
                    .catch(function(error) {
                        console.error('Error loading unlocked status:', error);
                        renderTopics();
                    });
            }

            function loadTopics() {
                fetch(API_BASE + '/topics')
                    .then(function(response) {
                        if (!response.ok) throw new Error('Network error');
                        return response.json();
                    })
                    .then(function(data) {
                        console.log('Topics loaded:', data.length);
                        topics = data;
                        loadUnlockedStatus();
                    })
                    .catch(function(error) {
                        console.error('Error loading topics:', error);
                        document.getElementById('loading').textContent = '❌ টপিক লোড করতে সমস্যা হয়েছে';
                    });
            }

            // ===== Categories =====
            document.querySelectorAll('.tab').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(function(t) {
                        t.classList.remove('active');
                    });
                    this.classList.add('active');
                });
            });

            // ===== Init =====
            setInterval(function() {
                loadUnlockedStatus();
            }, 60000);

            setTimeout(loadTopics, 100);
        })();
    </script>
</body>
</html>
